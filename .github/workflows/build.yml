name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Startup smoke test
        run: build\Release\arcade_hub.exe --smoke-test --preview
        shell: cmd

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: arcade_hub-windows
          path: |
            build/Release/arcade_hub.exe
            build/Release/assets

  linux:
    name: Linux (GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libxcursor-dev \
            libudev-dev libfreetype-dev xvfb ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Startup smoke test
        run: xvfb-run -a ./build/arcade_hub --smoke-test --preview
